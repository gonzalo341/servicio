spring.application.name=servicio
spring.datasource.url=jdbc:mysql://localhost:3306/tareas_db
spring.datasource.username=root
spring.datasource.password=

# Crea y actualiza las tablas automáticamente en MySQL
spring.jpa.hibernate.ddl-auto=update
# Muestra en la consola de IntelliJ las consultas SQL que ejecuta Spring
spring.jpa.show-sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
